name: Veri paketi

# Avrupa liglerinin biten maçları (iki sezon) + dünya piyasası oranları tek pakette (paket.json.gz), İddaa kayıtları,
# Pinnacle, yüksek oran takibi ve hata haritası. BahisYek uygulaması "veri" dalından indirir.
# GitHub'ın zamanlayıcısı bu depoda 3–5 saat gecikip tur atlayabildiği için: iş, maç saatlerinde nöbette kalır
# (15 dk'da bir hafif tur, saatte bir tam tur — arac/nobet.py) ve süresi dolunca kendini yeniden başlatır.
# Zamanlayıcı yalnız yedek: gece biten nöbeti sabah yeniden kurar.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      keskin_zorla:
        description: "İlk turda maçı olan bütün liglerin Pinnacle oranlarını çek (günlük kredi sınırı yine geçerli)"
        required: false
        default: "0"
      nobet:
        description: "Maç saatlerinde nöbette kal (0: yalnız tek tur)"
        required: false
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: veri
  cancel-in-progress: false

jobs:
  paket:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TOKEN: ${{ github.token }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Tam tur (paket, şut, keskin oranlar, bülten, takip, hata haritası)
        env:
          ZORLA: ${{ github.event.inputs.keskin_zorla }}
        run: bash arac/tur.sh tam

      - name: Nöbet (maç saatlerinde 15 dk'da bir)
        id: nobet
        # Zamanlayıcıda inputs boş gelir (null, '0' ile eşit sayılır): zamanlayıcı her zaman nöbete girer
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.nobet != '0'
        run: python3 arac/nobet.py

      - name: Sonraki nöbeti başlat
        if: steps.nobet.outputs.devam == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run veri.yml --ref main -R "${{ github.repository }}"
