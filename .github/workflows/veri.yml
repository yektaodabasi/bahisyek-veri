name: Veri paketi

# Avrupa liglerinin biten maçları (iki sezon) + dünya piyasası oranları tek pakette (paket.json.gz).
# BahisYek uygulaması "veri" dalından indirir: https://raw.githubusercontent.com/yektaodabasi/bahisyek-veri/veri/paket.json.gz
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      keskin_zorla:
        description: "Pinnacle oranlarını 20 saat beklemeden çek (günlük kredi sınırı yine geçerli)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: veri
  cancel-in-progress: false

jobs:
  paket:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Veri "veri" dalında durur (her çalışmada tek commit'lik tarih: depo şişmez); kod main'de.
      - name: Önceki veriyi al
        run: |
          mkdir -p eski
          if git fetch -q --depth 1 origin veri 2>/dev/null; then
            git --work-tree=eski checkout -q origin/veri -- . || true
            git reset -q
          fi
          ls eski | head

      - name: Paketi üret (öncekinin üstüne artımlı)
        run: python3 arac/paket.py eski

      - name: Keskin piyasa oranları (Pinnacle/konsensüs; The-Odds-API)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ZORLA: ${{ github.event.inputs.keskin_zorla }}
        run: python3 arac/oranlar.py eski || true

      - name: Bülteni kaydet (Nesine + DK + yorumcular)
        run: |
          mkdir -p kayit && cp -r eski/kayit/. kayit/ 2>/dev/null || true
          python3 arac/bulten_kaydet.py || true
          ls -la kayit | tail -3
          mkdir -p cikti/kayit && cp -r kayit/. cikti/kayit/
          mkdir -p cikti/gunluk && cp -rn eski/gunluk/. cikti/gunluk/ 2>/dev/null || true
          find cikti/kayit cikti/gunluk -type f -name "*.json" -mtime +120 -delete 2>/dev/null || true

      - name: Yüksek oran takibi (dönüş 1/2–2/1, 6+ gol)
        run: python3 arac/takip.py eski || true

      - name: veri dalına yaz
        run: |
          cd cikti
          git init -q -b veri
          git config user.name "veri"; git config user.email "veri@users.noreply.github.com"
          git add -A && git commit -qm "veri $(date -u +%FT%H:%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" veri
          echo "::notice title=Paket::$(tr -d '\n ' < paket_bilgi.json | head -c 400)"
          echo "::notice title=Keskin oranlar::$(python3 -c "import json;o=json.load(open('oranlar.json'));print('olay',len(o.get('olaylar',[])),'kalan',o.get('kalan'),'çekim',o.get('sonCekim'))" 2>/dev/null)"
