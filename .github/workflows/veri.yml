name: Veri paketi

# Avrupa liglerinin biten maçları (iki sezon) + dünya piyasası oranları tek pakette (paket.json.gz).
# BahisYek uygulaması bu depodan indirir: https://raw.githubusercontent.com/yektaodabasi/bahisyek-veri/main/paket.json.gz
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veri
  cancel-in-progress: false

jobs:
  paket:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Paketi üret (öncekinin üstüne artımlı)
        run: |
          mkdir -p eski
          cp paket.json.gz paket_bilgi.json bekleyen.json eski/ 2>/dev/null || true
          cp -r kayit eski/ 2>/dev/null || true
          python3 arac/paket.py eski

      - name: Bülteni kaydet (Nesine + DK + yorumcular)
        run: |
          mkdir -p kayit
          python3 arac/bulten_kaydet.py || true

      - name: Yayınla
        run: |
          cp cikti/paket.json.gz cikti/paket_bilgi.json cikti/bekleyen.json . 2>/dev/null || true
          mkdir -p gunluk && cp -r cikti/gunluk/. gunluk/ 2>/dev/null || true
          # Günlük kayıtlar 120 günden eskiyse sil (depo şişmesin)
          find kayit gunluk -type f -name "*.json" -mtime +120 -delete 2>/dev/null || true
          git config user.name "veri"; git config user.email "veri@users.noreply.github.com"
          git add -A paket.json.gz paket_bilgi.json bekleyen.json kayit gunluk
          git commit -qm "veri $(date -u +%FT%H:%M)" || echo "değişiklik yok"
          # Geçmiş şişmesin: tek commit'lik tarih (orphan) olarak zorla
          git checkout -q --orphan yeni && git add -A && git commit -qm "veri $(date -u +%FT%H:%M)" && git branch -D main -q && git branch -m main
          git push -qf origin main
          echo "::notice title=Paket::$(head -c 300 paket_bilgi.json)"
